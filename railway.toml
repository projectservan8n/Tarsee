[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
requiredMountPath = "/data"

[variables]
NODE_ENV = "production"
TARSEE_STATE_DIR = "/data/tarsee"
TARSEE_WORKSPACE_DIR = "/data/tarsee/workspace"
TARSEE_DATA_DIR = "/data/tarsee/data"
