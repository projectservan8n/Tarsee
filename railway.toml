[build]
builder = "dockerfile"
# Only rebuild/redeploy when files that actually affect the container change.
# Commits that only touch docs, tests, issue templates, CI configs, or the
# plan/memory scratchpads do not trigger a redeploy on user installations
# (and in turn do not wipe their running containers). If you add a new
# top-level directory that MUST ship, add it here.
watchPatterns = [
  "src/**",
  "package.json",
  "package-lock.json",
  "Dockerfile",
  ".dockerignore",
  "entrypoint.sh",
  "railway.toml",
]

[deploy]
healthcheckPath = "/healthz"
# Fail fast on wedged boots — /healthz is the fast-path endpoint.
# Previous 300s hid real problems for five minutes per deploy.
healthcheckTimeout = 60
restartPolicyType = "on_failure"
requiredMountPath = "/data"

[variables]
NODE_ENV = "production"
TARSEE_STATE_DIR = "/data/tarsee"
TARSEE_WORKSPACE_DIR = "/data/tarsee/workspace"
TARSEE_DATA_DIR = "/data/tarsee/data"
