# Tarsee — Self-hosted Docker Compose
version: "3.8"

services:
  tarsee:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - tarsee-data:/data
    environment:
      - PORT=3000
      - SETUP_PASSWORD=${SETUP_PASSWORD}
      - TARSEE_STATE_DIR=/data/tarsee
      - TARSEE_WORKSPACE_DIR=/data/tarsee/workspace
      - TARSEE_DATA_DIR=/data/tarsee/data
      # AI Provider keys (set in .env file or env)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Optional encryption key for stored secrets
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  tarsee-data:
