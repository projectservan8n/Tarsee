<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Order flow</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1a1a; color: #ececec; font-family: Poppins, -apple-system, sans-serif; padding: 20px; }
  .title { font-size: 18px; font-weight: 600; color: #f5a623; margin-bottom: 16px; }
  .stage { position: relative; width: 800px; height: 440px; margin: 0 auto; }
  svg.edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .node { position: absolute; border: 1.5px solid; border-radius: 10px; padding: 14px 18px; cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; flex-direction: column; justify-content: center; font-size: 14px; }
  .node:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,166,35,.25); border-color: #f5a623 !important; }
  .node .label { font-weight: 600; }
  .node .sub { font-size: 12px; opacity: .8; margin-top: 4px; font-weight: 400; }
  .node.is-note { border-style: dashed; cursor: default; font-style: italic; }
  .node.is-note:hover { transform: none; box-shadow: none; border-color: inherit !important; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }
  .pill { padding: 6px 12px; border-radius: 6px; font-size: 12px; border: 1.5px solid; }
</style>
</head>
<body>
<div class="title">Order flow</div>
<div class="stage">
  <svg class="edges" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5855"/>
      </marker>
    </defs>
    <path d="M 250 120 C 250 150, 400 150, 400 180" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 260 C 400 290, 250 290, 250 320" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="333" y="290" fill="#a8a8a0" font-size="12" font-family="Poppins,sans-serif">yes</text><path d="M 400 260 C 400 290, 550 290, 550 320" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="483" y="290" fill="#a8a8a0" font-size="12" font-family="Poppins,sans-serif">no</text>
  </svg>
  <div class="node" data-node-id="in" data-label="Order arrives" data-sublabel="webhook" style="left:120px;top:40px;width:260px;height:80px;background:#3a3935;border-color:#5a5855;color:#ececec"><div class="label">Order arrives</div><div class="sub">webhook</div></div><div class="node" data-node-id="check" data-label="In stock?" data-sublabel="" style="left:270px;top:180px;width:260px;height:80px;background:#a87a2e;border-color:#d1a44a;color:#1a1a1a"><div class="label">In stock?</div></div><div class="node" data-node-id="ship" data-label="Ship it" data-sublabel="" style="left:120px;top:320px;width:260px;height:80px;background:#2d6b5f;border-color:#48a392;color:#ffffff"><div class="label">Ship it</div></div><div class="node" data-node-id="wait" data-label="Back-order" data-sublabel="email the buyer" style="left:420px;top:320px;width:260px;height:80px;background:#4a3d7a;border-color:#6c5aa8;color:#ffffff"><div class="label">Back-order</div><div class="sub">email the buyer</div></div><div class="node is-note" data-node-id="n1" data-label="Runs every minute" data-sublabel="" style="left:420px;top:40px;width:260px;height:50px;background:transparent;border-color:transparent;color:#a8a8a0"><div class="label">Runs every minute</div></div>
</div>
<div class="legend"><div class="pill" style="background:#3a3935;border-color:#5a5855;color:#ececec">Trigger / storage</div><div class="pill" style="background:#a87a2e;border-color:#d1a44a;color:#1a1a1a">Choice</div><div class="pill" style="background:#2d6b5f;border-color:#48a392;color:#ffffff">Output</div><div class="pill" style="background:transparent;border-color:transparent;color:#a8a8a0">Note</div><div class="pill" style="background:#4a3d7a;border-color:#6c5aa8;color:#ffffff">Processing</div></div>
<script>
(function() {
  const questions = {"in":"Where do orders come from?","check":"How is stock checked?"};
  const diagramId = "diagram-order-flow";
  document.querySelectorAll('.node:not(.is-note)').forEach((el) => {
    el.addEventListener('click', () => {
      const nodeId = el.dataset.nodeId;
      const label = el.dataset.label;
      const sublabel = el.dataset.sublabel;
      const question = questions[nodeId];
      try {
        window.parent.postMessage({
          type: 'tarsee:diagram-click',
          diagramId, nodeId, label, sublabel, question,
        }, '*');
      } catch (e) { /* sandboxed */ }
    });
  });
})();
</script>
</body>
</html>
