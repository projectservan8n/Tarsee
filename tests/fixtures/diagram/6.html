<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Wide row and non-ASCII ✓</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1a1a1a; color: #ececec; font-family: Poppins, -apple-system, sans-serif; padding: 20px; }
  .title { font-size: 18px; font-weight: 600; color: #f5a623; margin-bottom: 16px; }
  .stage { position: relative; width: 1170px; height: 400px; margin: 0 auto; }
  svg.edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .node { position: absolute; border: 1.5px solid; border-radius: 10px; padding: 14px 18px; cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; flex-direction: column; justify-content: center; font-size: 14px; }
  .node:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,166,35,.25); border-color: #f5a623 !important; }
  .node .label { font-weight: 600; }
  .node .sub { font-size: 12px; opacity: .8; margin-top: 4px; font-weight: 400; }
  .node.is-note { border-style: dashed; cursor: default; font-style: italic; }
  .node.is-note:hover { transform: none; box-shadow: none; border-color: inherit !important; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }
  .pill { padding: 6px 12px; border-radius: 6px; font-size: 12px; border: 1.5px solid; }
</style>
</head>
<body>
<div class="title">Wide row and non-ASCII ✓</div>
<div class="stage">
  <svg class="edges" viewBox="0 0 1170 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5855"/>
      </marker>
    </defs>
    <path d="M 400 120 C 400 150, -200 150, -200 180" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 120 C 400 150, 100 150, 100 180" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 120 C 400 150, 400 150, 400 180" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 120 C 400 150, 700 150, 700 180" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 120 C 400 150, 1000 150, 1000 180" stroke="#5a5855" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="708" y="150" fill="#a8a8a0" font-size="12" font-family="Poppins,sans-serif">last</text>
  </svg>
  <div class="node" data-node-id="root" data-label="Wurzel – 根" data-sublabel="" style="left:270px;top:40px;width:260px;height:80px;background:#4a3d7a;border-color:#6c5aa8;color:#ffffff"><div class="label">Wurzel – 根</div></div><div class="node" data-node-id="k1" data-label="🐒 one" data-sublabel="" style="left:-330px;top:180px;width:260px;height:80px;background:#4a3d7a;border-color:#6c5aa8;color:#ffffff"><div class="label">🐒 one</div></div><div class="node" data-node-id="k2" data-label="two" data-sublabel="" style="left:-30px;top:180px;width:260px;height:80px;background:#4a3d7a;border-color:#6c5aa8;color:#ffffff"><div class="label">two</div></div><div class="node" data-node-id="k3" data-label="three" data-sublabel="" style="left:270px;top:180px;width:260px;height:80px;background:#4a3d7a;border-color:#6c5aa8;color:#ffffff"><div class="label">three</div></div><div class="node" data-node-id="k4" data-label="four" data-sublabel="" style="left:570px;top:180px;width:260px;height:80px;background:#4a3d7a;border-color:#6c5aa8;color:#ffffff"><div class="label">four</div></div><div class="node" data-node-id="k5" data-label="five" data-sublabel="" style="left:870px;top:180px;width:260px;height:80px;background:#2d6b5f;border-color:#48a392;color:#ffffff"><div class="label">five</div></div>
</div>
<div class="legend"><div class="pill" style="background:#2d6b5f;border-color:#48a392;color:#ffffff">&lt;i&gt;done&lt;/i&gt;</div><div class="pill" style="background:#4a3d7a;border-color:#6c5aa8;color:#ffffff">Processing</div></div>
<script>
(function() {
  const questions = {};
  const diagramId = "Wide row and non-ASCII ✓";
  document.querySelectorAll('.node:not(.is-note)').forEach((el) => {
    el.addEventListener('click', () => {
      const nodeId = el.dataset.nodeId;
      const label = el.dataset.label;
      const sublabel = el.dataset.sublabel;
      const question = questions[nodeId];
      try {
        window.parent.postMessage({
          type: 'tarsee:diagram-click',
          diagramId, nodeId, label, sublabel, question,
        }, '*');
      } catch (e) { /* sandboxed */ }
    });
  });
})();
</script>
</body>
</html>
